[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
norecursedirs = .claude Output SourceTexts __pycache__ Builds/Tests
# The slow order matrix is opt-in: `pytest -m slow` (a later -m overrides this one).
addopts = -m "not slow" -n auto
# With UPDATE_SNAPSHOTS=1, conftest serializes snapshot tests onto one worker
# so concurrent read-modify-write on the golden JSON files is safe.
markers =
    slow: the full order-invariance matrix (reversed + extra shuffles); run with -m slow
